      level: 85%

    - name: Machine Learning & AI
      details: Supervised & unsupervised learning, deep learning, LLMs, NLP (embeddings, TF-IDF), model interpretability (LIME, SHAP)
      level: 75%

    - name: Computational Biology & Pharmacometric Modeling
      details: Monolix, NONMEM, PK/PD, biomarker & clinical data modeling, real-world evidence analysis, multi-omics
      level: 80%

