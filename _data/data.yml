      details: Monolix, NONMEM, real-world evidence analysis, exposure–response modeling
      level: 80%

    - name: Digital Health & Cloud
      details: IBM WatsonX, MS Azure, clinical data pipelines, ODK/ODK-X, data privacy & governance (GDPR), cybersecurity awareness
      level: 60%

    - name: Life Sciences & Lab
      details: Biomarker characterization (flow cytometry), assay development & validation, preformulation studies, experimental drug-delivery research (microneedles, microspheres)
      level: 80%

    - name: Collaboration
      details: Agile workflows, Design Thinking (IBM-certified), cross-functional & stakeholder collaboration, multi-country & cross-cultural teams, scientific writing, regulatory awareness
      level: 90%