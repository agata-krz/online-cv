career-profile:
  title: Career Profile
  summary: |
    Data scientist and engineer with a life-sciences and lab-research foundation, bridging pharmaceutical R&D, hospital-based healthcare, and academic clinical research. Builds production-grade clinical and real-world data pipelines and applies machine learning and statistical modeling to heterogeneous, multi-modal health data. Comfortable operating at the interface of experimental science, data engineering, and clinical or scientific stakeholders, translating between technical and domain-expert teams.
      
experiences:
  title: Experience
  info:
  - company: Kantonsspital Aarau (KSA), Aarau
    time: Apr 2026 – Present
    role: Data Scientist / Wissenschaftliche Mitarbeiterin
    details: |
        - Designing and building end-to-end clinical data pipelines, partnering with radiology clinicians, pathologists and infrastructure specialists to turn clinical requirements into production data workflows.
        - Leading a model-validation research workstream benchmarking LLM-based structured extraction from pathology reports against expert-labeled ground truth, applying statistical agreement and bias-analysis methods suited to regulated clinical settings.
        - Engineering research-grade datasets from heterogeneous hospital source systems, working within data governance, access-control, and compliance requirements.

  - company: Swiss Tropical and Public Health Institute (Swiss TPH), Allschwil
    time: Mar 2026 – Apr 2026
    role: Data Analysis Contributor
    details: |
      Conducted statistical analysis of quantitative data and produced publication-ready figures for a research study manuscript.

  - company: Swiss Tropical and Public Health Institute (Swiss TPH), Allschwil
    time: Aug 2025 – Mar 2026
    role: Guest Scientist
    details: |
        - Piloted an unsupervised, DTW-based time-series clustering approach to 200,000+ pediatric clinical records across 260+ primary healthcare facilities to identify facility-level determinants of intervention uptake invisible to standard cross-sectional analysis.
        - Collaborated with a multidisciplinary, multi-country research team spanning epidemiology, public health, and data science to translate unsupervised ML findings into actionable recommendations.

  - company: University Children’s Hospital Basel (UKBB), Basel
    time: Feb 2025 – Aug 2025
    role: Intern
    details: |
      Supported clinical decision-making in pediatric care using pharmacometric simulation and modeling to optimize caffeine dosing in neonates.
        - Population PK/PD modeling
        - Dose–response simulation and regression-based prediction

  - company: Leiden University Medical Center (LUMC), Leiden
    time: Feb 2016 – Apr 2024
    role: Researcher
    details: |
      Conducted experimental and computational research on drug delivery optimization, characterizing dissolving microneedles
      and microspheres for intradermal delivery applications.
        - Built and validated PK/PD models simulating epilepsy treatment outcomes using real-world patient data, informing dosing strategy recommendations.
        - Managed and integrated heterogeneous datasets spanning clinical, experimental, and biomarker domains across multiple concurrent long-term projects.

  - company: Novartis, Basel
    time: 2011, 2013, 2014 – 2015
    role: Research Intern
    details: |
      Characterized biomarkers using flow cytometry on human whole blood at the Department of Translational Medicine,
      contributing to assay development and internal validation reporting.
        - Conducted preformulation studies assessing solubility, stability, and storage-condition sensitivity of pharmaceutical compounds across two separate internship periods.

education:
  title: Education
  info:
  - degree: M.Sc. in Medical Informatics – Pharma Informatics
    university: University of Applied Sciences and Arts Northwestern Switzerland (FHNW)
    time: 2024 – 2026
    details: |
      Focus on AI, data science, and mathematical modeling in drug discovery, clinical
      studies, and healthcare data analysis. Coursework also includes digital biomarkers,
      healthcare cybersecurity, and cloud computing.
      
  - degree: B.Sc. in Natural Sciences
    university: Maastricht University, Netherlands
    time: 2011 – 2014
    details: |
      Combined molecular biology, chemistry, and pharmacology. Bachelor thesis on antioxidant reaction kinetics
      involved quantitative biochemical analysis and modeling, sparking long-term interest in data-driven biology.

